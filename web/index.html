<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BulldogBeats</title>
<meta name="theme-color" content="#F3F3F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BulldogBeats">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <nav class="sidebar" aria-label="Hauptnavigation">
    <a class="brand" href="#/alben"><span class="logo">BB</span><span>BulldogBeats</span></a>
    <div class="nav-group">
      <div class="nav-title">Bibliothek</div>
      <a class="nav-link" href="#/alben" data-nav="alben">Alben</a>
      <a class="nav-link" href="#/interpreten" data-nav="interpreten">Interpreten</a>
      <a class="nav-link" href="#/jahre" data-nav="jahre">Jahre</a>
      <a class="nav-link" href="#/suche" data-nav="suche">Suche</a>
      <a class="nav-link" href="#/wiedergabe" data-nav="wiedergabe">Wiedergabe</a>
    </div>
    <div class="nav-group">
      <div class="nav-title">Playlists</div>
      <a class="nav-link" href="#/playlists" data-nav="playlists">Alle Playlists</a>
    </div>
    <div class="sources" id="sources"></div>
  </nav>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn back" id="back" aria-label="Zurück" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <label class="searchbox">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="search" type="search" placeholder="Alben, Interpreten, Titel suchen" autocomplete="off" aria-label="Suchen">
        <kbd>⌘F</kbd>
      </label>
      <div class="device"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg><span>Wiedergabe auf: <strong id="device-name">diesem Gerät</strong></span></div>
    </header>
    <div class="content" id="content" tabindex="-1"></div>
  </main>

  <footer class="playerbar" id="playerbar">
    <button class="pb-now" id="pb-now" aria-label="Wiedergabe öffnen">
      <span class="pb-cover" id="pb-cover"></span>
      <span class="pb-text"><span class="pb-title" id="pb-title">Nichts ausgewählt</span><span class="pb-sub" id="pb-sub"></span></span>
    </button>
    <div class="pb-center">
      <div class="pb-controls">
        <button class="icon-btn small" id="btn-shuffle" aria-label="Zufallswiedergabe" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3c4 0 6 10 10 10h5M18 14l3 3-3 3M3 17h3c1.6 0 2.8-1.6 3.8-3.5M13 9.5C14 8 15 7 16 7h5M18 4l3 3-3 3"/></svg></button>
        <button class="icon-btn" id="btn-prev" aria-label="Vorheriger Titel"><svg viewBox="0 0 24 24" class="fill" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="play-btn" id="btn-play" aria-label="Wiedergabe"><svg viewBox="0 0 24 24" class="fill" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg></button>
        <button class="icon-btn" id="btn-next" aria-label="Nächster Titel"><svg viewBox="0 0 24 24" class="fill" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <button class="icon-btn small" id="btn-repeat" aria-label="Wiederholen" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"/></svg></button>
      </div>
      <div class="pb-progress">
        <span id="t-cur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position im Titel">
        <span id="t-dur">0:00</span>
      </div>
    </div>
    <div class="pb-right">
      <a class="icon-btn" href="#/wiedergabe?tab=lyrics" aria-label="Liedtext"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h11M4 18h7"/></svg></a>
      <a class="icon-btn" href="#/wiedergabe?tab=queue" aria-label="Warteschlange"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h12M4 12h12M4 18h7M18 15v6M15 18h6"/></svg></a>
      <span class="hint">Leertaste: Pause · ← →: Titel</span>
      <input type="range" id="volume" min="0" max="100" value="100" aria-label="Lautstärke">
    </div>
    <button class="pb-mini-play" id="btn-mini-play" aria-label="Wiedergabe"><svg viewBox="0 0 24 24" class="fill" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg></button>
  </footer>

  <nav class="tabbar" aria-label="Navigation">
    <a href="#/alben" data-tab="alben"><span class="bar"></span>Bibliothek</a>
    <a href="#/suche" data-tab="suche"><span class="bar"></span>Suche</a>
    <a href="#/playlists" data-tab="playlists"><span class="bar"></span>Playlists</a>
    <a href="#/offline" data-tab="offline"><span class="bar"></span>Offline</a>
  </nav>
</div>
<audio id="audio" preload="auto"></audio>
<script type="module" src="/js/app.js"></script>
</body>
</html>
