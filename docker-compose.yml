# Plattenregal: eigene Oberfläche + Navidrome als Musikserver
# Start:  docker compose up -d
services:
  navidrome:
    image: deluan/navidrome:0.64.2
    container_name: plattenregal-navidrome
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"     # Verwaltung (Benutzer, Scan) unter http://SERVER:4533
    environment:
      ND_SCANNER_SCHEDULE: "@every 1h"     # neue Alben stündlich einlesen
      ND_SCANNER_WATCHERWAIT: "10s"        # Änderungen im Ordner zusätzlich sofort erkennen
      ND_SUBSONIC_ARTISTPARTICIPATIONS: "true"   # Interpreten-Seite zeigt auch Sampler, auf denen sie vorkommen
      ND_LYRICSPRIORITY: ".lrc,.txt,embedded"
      ND_ENABLESTARRATING: "true"
      ND_ENABLEFAVOURITES: "true"
      ND_ENABLEDOWNLOADS: "true"
      ND_DEFAULTLANGUAGE: "de"
      ND_LOGLEVEL: "info"
      # Künstlerfotos kommen automatisch von Deezer; mit Last.fm-Schlüssel zusätzlich Biografien
      ND_LASTFM_APIKEY: "${LASTFM_APIKEY:-}"
      ND_LASTFM_SECRET: "${LASTFM_SECRET:-}"
    volumes:
      - ./data/navidrome:/data
      - "${MUSIC_DIR:?Bitte MUSIC_DIR in der Datei .env setzen}:/music:ro"   # nur lesen: deine FLACs werden nie verändert

  web:
    image: nginx:1.29-alpine
    container_name: plattenregal-web
    restart: unless-stopped
    depends_on: [navidrome]
    ports:
      - "${WEB_PORT:-8080}:80"             # Oberfläche unter http://SERVER:8080
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
